<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Click Ball Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
canvas{display:block;background:#080818;}
#ui{
    position:fixed;top:16px;left:16px;
    color:#fff;font-family:Arial;font-size:22px;z-index:10;
}
#topRight{
    position:fixed;top:16px;right:16px;z-index:10;display:flex;gap:10px;
}
#topRight button{
    padding:8px 16px;font-size:14px;font-family:Arial;
    border:none;border-radius:6px;background:#C9A66B;
    color:#0D1B2A;cursor:pointer;font-weight:bold;
}
#topRight button:hover{background:#b8955a;}
#startScreen{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(8,8,24,0.92);z-index:100;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    color:#fff;font-family:Arial;
}
#startScreen h1{font-size:36px;margin-bottom:16px;color:#C9A66B;}
#startScreen p{
    font-size:15px;color:#aaa;margin-bottom:30px;
    line-height:1.6;text-align:center;
}
#startBtn{
    padding:14px 48px;font-size:18px;border:none;border-radius:8px;
    background:#C9A66B;color:#0D1B2A;cursor:pointer;font-weight:bold;
}
#startBtn:hover{background:#b8955a;}
#pauseOverlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(8,8,24,0.7);z-index:50;
    display:none;align-items:center;justify-content:center;
    color:#C9A66B;font-size:32px;font-family:Arial;font-weight:bold;
}
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span></div>

<div id="topRight">
    <button id="pauseBtn">暂停</button>
    <button id="resetBtn">重来</button>
</div>

<div id="pauseOverlay">已暂停</div>

<div id="startScreen">
    <h1>🎯 点击小球</h1>
    <p>小球会随机出现，在消失前点中它 +10分<br>
    没点到小球消失 -5分<br>
    分数越高，小球存在时间越短，难度逐步收敛</p>
    <button id="startBtn">开始游戏</button>
</div>

<!-- 用国内更快的CDN -->
<script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ========== 先绑定UI按钮（不依赖Three.js，先确保按钮能用） ==========
let gameStarted = false;
let gamePaused = false;

document.getElementById("startBtn").addEventListener("click", ()=>{
    document.getElementById("startScreen").style.display = "none";
    gameStarted = true;
    lastSpawnTime = performance.now();
});

document.getElementById("pauseBtn").addEventListener("click", ()=>{
    if(!gameStarted) return;
    gamePaused = !gamePaused;
    document.getElementById("pauseOverlay").style.display = gamePaused ? "flex" : "none";
    document.getElementById("pauseBtn").innerText = gamePaused ? "继续" : "暂停";
});

document.getElementById("resetBtn").addEventListener("click", ()=>{
    ballList.forEach(b=>scene.remove(b.mesh));
    ballList = [];
    score = 0;
    scoreDom.innerText = 0;
    gamePaused = false;
    document.getElementById("pauseOverlay").style.display = "none";
    document.getElementById("pauseBtn").innerText = "暂停";
    lastSpawnTime = performance.now();
});

// ========== Three.js 场景初始化 ==========
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const pointLight = new THREE.PointLight(0xffffff, 0.8);
pointLight.position.set(3,4,4);
scene.add(pointLight);
camera.position.z = 12;

const scoreDom = document.getElementById("score");
let score = 0;

const BASE_DURATION = 2.2;
const MIN_DURATION = 0.6;
const CONVERGE_SPEED = 0.025;
let ballList = [];
let lastSpawnTime = 0;
const SPAWN_INTERVAL = 1300;

function getBallLifeTime(){
    const diff = BASE_DURATION - MIN_DURATION;
    const remain = diff * Math.exp(-CONVERGE_SPEED * score);
    return MIN_DURATION + remain;
}

function spawnBall(){
    const geo = new THREE.SphereGeometry(0.45,24,24);
    const mat = new THREE.MeshPhongMaterial({
        color: new THREE.Color(Math.random(), Math.random(), Math.random())
    });
    const ball = new THREE.Mesh(geo, mat);
    ball.position.set(
        (Math.random()-0.5)*7,
        (Math.random()-0.5)*5,
        0
    );
    scene.add(ball);
    ballList.push({
        mesh: ball,
        expireTime: performance.now() + getBallLifeTime() * 1000,
        isClicked: false
    });
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
window.addEventListener("click", (e)=>{
    if(!gameStarted || gamePaused) return;
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(ballList.map(b=>b.mesh));
    if(intersects.length > 0){
        const hitMesh = intersects[0].object;
        const hitItem = ballList.find(b=>b.mesh === hitMesh);
        if(hitItem && !hitItem.isClicked){
            hitItem.isClicked = true;
            score += 10;
            scoreDom.innerText = score;
        }
    }
})

function animate(timeStamp){
    requestAnimationFrame(animate);
    if(gameStarted && !gamePaused){
        if(timeStamp - lastSpawnTime > SPAWN_INTERVAL){
            spawnBall();
            lastSpawnTime = timeStamp;
        }
        const now = performance.now();
        for(let i = ballList.length - 1; i >= 0; i--){
            const b = ballList[i];
            if(now > b.expireTime){
                if(!b.isClicked){
                    score -= 5;
                    scoreDom.innerText = score;
                }
                scene.remove(b.mesh);
                ballList.splice(i,1);
            }
        }
    }
    renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
})
</script>
</body>
</html>
